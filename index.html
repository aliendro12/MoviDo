<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 MoviDo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .contenedor {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .fila-controles {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 130px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #bbb;
            background: white;
        }

        input[type="range"] {
            width: 160px;
        }

        .volumen-contenedor {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
        }

        #valorVolumen {
            min-width: 40px;
            font-size: 14px;
            color: #555;
        }

        .seccion {
            margin-top: 20px;
        }

        .titulo-seccion {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 17px;
            cursor: pointer;
            background: #e5e5e5;
            transition: 0.15s;
        }

        button:hover {
            background: #d2d2d2;
        }

        button:active {
            transform: scale(0.96);
        }

        .boton-tonica {
            display: block;
            margin: 0 auto;
            background: #dcecff;
        }

        .boton-tonica:hover {
            background: #c9e1ff;
        }

        .opciones-mostrar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .opciones-mostrar label {
            font-weight: normal;
            cursor: pointer;
        }

        .opciones-mostrar input {
            margin-right: 5px;
            cursor: pointer;
        }

        .melodia {
            min-height: 70px;
            border: 2px dashed #bbb;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .melodia-vacia {
            color: #999;
            width: 100%;
            text-align: center;
        }

        .nota-melodia {
            background: #dff2df;
            border: 1px solid #a8d3a8;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .nota-melodia:hover {
            background: #cce8cc;
        }

        .controles-melodia {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .reproducir {
            background: #dff2df;
        }

        .reproducir:hover {
            background: #cce8cc;
        }

        .borrar {
            background: #f5dada;
        }

        .borrar:hover {
            background: #ecc7c7;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .contenedor {
                padding: 18px;
            }

            .fila-controles {
                flex-direction: column;
            }

            .control {
                width: 100%;
            }

            select {
                width: 100%;
            }

            .volumen-contenedor {
                width: 100%;
            }

            input[type="range"] {
                flex: 1;
                width: auto;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>🎵 MoviDo</h1>

    <div class="subtitulo">
        Verificador melódico mediante solfeo movible
    </div>


    <div class="fila-controles">

        <div class="control">
            <label for="modo">Modo</label>

            <select id="modo">
                <option value="mayor">Mayor</option>
                <option value="menor">Menor</option>
            </select>
        </div>


        <div class="control">
            <label for="tonica">Tónica</label>

            <select id="tonica">
                <option value="C">Do</option>
                <option value="Db">Re♭</option>
                <option value="D">Re</option>
                <option value="Eb">Mi♭</option>
                <option value="E">Mi</option>
                <option value="F">Fa</option>
                <option value="F#">Fa♯</option>
                <option value="G">Sol</option>
                <option value="Ab">La♭</option>
                <option value="A">La</option>
                <option value="Bb">Si♭</option>
                <option value="B">Si</option>
            </select>
        </div>


        <div class="control">
            <label for="timbre">Timbre</label>

            <select id="timbre">
                <option value="sine">Senoidal</option>
                <option value="triangle" selected>Triangular</option>
                <option value="square">Cuadrada</option>
                <option value="sawtooth">Sierra</option>
            </select>
        </div>


        <div class="control">
            <label for="volumen">Volumen</label>

            <div class="volumen-contenedor">

                <input
                    type="range"
                    id="volumen"
                    min="0"
                    max="100"
                    value="70"
                >

                <span id="valorVolumen">
                    70%
                </span>

            </div>
        </div>

    </div>


    <button
        class="boton-tonica"
        id="escucharTonica"
    >
        🎵 Escuchar la tónica
    </button>


    <div class="seccion">

        <div class="titulo-seccion">
            Mostrar como:
        </div>

        <div class="opciones-mostrar">

            <label>
                <input
                    type="radio"
                    name="formaMostrar"
                    value="solfeo"
                    checked
                >
                Solfeo
            </label>

            <label>
                <input
                    type="radio"
                    name="formaMostrar"
                    value="grados"
                >
                Grados
            </label>

        </div>

    </div>


    <div class="seccion">

        <div class="titulo-seccion">
            Notas
        </div>

        <div
            class="botones"
            id="botonesNotas"
        ></div>

    </div>


    <div class="seccion">

        <div class="titulo-seccion">
            Melodía
        </div>

        <div
            class="melodia"
            id="melodia"
        >

            <div class="melodia-vacia">
                Hacé clic en las notas para construir la melodía
            </div>

        </div>


        <div class="controles-melodia">

            <button
                class="reproducir"
                id="reproducir"
            >
                ▶ Reproducir
            </button>

            <button id="ultima">
                ⌫ Última
            </button>

            <button
                class="borrar"
                id="borrar"
            >
                🗑 Borrar todo
            </button>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // FRECUENCIAS DE LAS TÓNICAS
    // ==========================================

    const frecuencias = {

        "C": 261.63,
        "Db": 277.18,
        "D": 293.66,
        "Eb": 311.13,
        "E": 329.63,
        "F": 349.23,
        "F#": 369.99,
        "G": 392.00,
        "Ab": 415.30,
        "A": 440.00,
        "Bb": 466.16,
        "B": 493.88

    };


    // ==========================================
    // ESCALA MAYOR
    // do = tónica
    // ==========================================

    const escalaMayor = [

        { silaba: "so", semitonos: -5, grado: "5" },
        { silaba: "la", semitonos: -3, grado: "6" },
        { silaba: "ti", semitonos: -1, grado: "7" },

        { silaba: "do", semitonos: 0, grado: "1" },
        { silaba: "re", semitonos: 2, grado: "2" },
        { silaba: "mi", semitonos: 4, grado: "3" },
        { silaba: "fa", semitonos: 5, grado: "4" },
        { silaba: "so", semitonos: 7, grado: "5" },
        { silaba: "la", semitonos: 9, grado: "6" },
        { silaba: "ti", semitonos: 11, grado: "7" },

        { silaba: "do'", semitonos: 12, grado: "1" },
        { silaba: "re'", semitonos: 14, grado: "2" },
        { silaba: "mi'", semitonos: 16, grado: "3" },
        { silaba: "fa'", semitonos: 17, grado: "4" },
        { silaba: "so'", semitonos: 19, grado: "5" }

    ];


    // ==========================================
    // ESCALA MENOR
    // la = tónica
    // ==========================================

    const escalaMenor = [

        { silaba: "si", semitonos: -1, grado: "♭7" },

        { silaba: "la", semitonos: 0, grado: "1" },
        { silaba: "ti", semitonos: 2, grado: "2" },
        { silaba: "do", semitonos: 3, grado: "♭3" },
        { silaba: "re", semitonos: 5, grado: "4" },
        { silaba: "mi", semitonos: 7, grado: "5" },
        { silaba: "fa", semitonos: 8, grado: "♭6" },
        { silaba: "fi", semitonos: 9, grado: "6" },
        { silaba: "so", semitonos: 10, grado: "♭7" },
        { silaba: "si", semitonos: 11, grado: "7" },

        { silaba: "la", semitonos: 12, grado: "1" },
        { silaba: "ti", semitonos: 14, grado: "2" },
        { silaba: "do'", semitonos: 15, grado: "♭3" },
        { silaba: "re'", semitonos: 17, grado: "4" },
        { silaba: "mi'", semitonos: 19, grado: "5" },
        { silaba: "fa'", semitonos: 20, grado: "♭6" }

    ];


    // ==========================================
    // VARIABLES
    // ==========================================

    let secuencia = [];

    let modoActual = "mayor";

    let formaMostrar = "solfeo";

    let audioContext = null;


    // ==========================================
    // AUDIO
    // ==========================================

    function obtenerAudioContext() {

        if (!audioContext) {

            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        if (audioContext.state === "suspended") {

            audioContext.resume();

        }

        return audioContext;

    }


    function obtenerVolumen() {

        const valor =
            Number(
                document.getElementById("volumen").value
            );

        return valor / 100;

    }


    function obtenerTimbre() {

        return document
            .getElementById("timbre")
            .value;

    }


    function reproducirFrecuencia(
        frecuencia,
        duracion = 0.45
    ) {

        const ctx =
            obtenerAudioContext();

        const oscilador =
            ctx.createOscillator();

        const ganancia =
            ctx.createGain();


        oscilador.type =
            obtenerTimbre();

        oscilador.frequency.value =
            frecuencia;


        const volumen =
            obtenerVolumen();


        ganancia.gain.setValueAtTime(
            0.0001,
            ctx.currentTime
        );


        ganancia.gain.exponentialRampToValueAtTime(
            Math.max(0.0001, volumen),
            ctx.currentTime + 0.02
        );


        ganancia.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + duracion
        );


        oscilador.connect(
            ganancia
        );

        ganancia.connect(
            ctx.destination
        );


        oscilador.start();

        oscilador.stop(
            ctx.currentTime + duracion + 0.02
        );

    }


    function frecuenciaNota(
        semitonos
    ) {

        const tonica =
            document
                .getElementById("tonica")
                .value;


        const frecuenciaTonica =
            frecuencias[tonica];


        return frecuenciaTonica *
            Math.pow(
                2,
                semitonos / 12
            );

    }


    // ==========================================
    // ESCALA ACTUAL
    // ==========================================

    function obtenerEscala() {

        if (
            modoActual === "mayor"
        ) {

            return escalaMayor;

        }

        return escalaMenor;

    }


    // ==========================================
    // TEXTO DE NOTAS
    // ==========================================

    function textoNota(
        nota
    ) {

        if (
            formaMostrar === "solfeo"
        ) {

            return nota.silaba;

        }

        return nota.grado;

    }


    // ==========================================
    // BOTONES DE NOTAS
    // ==========================================

    function crearBotones() {

        const contenedor =
            document
                .getElementById(
                    "botonesNotas"
                );


        contenedor.innerHTML =
            "";


        const escala =
            obtenerEscala();


        escala.forEach(
            (nota, indice) => {

                const boton =
                    document.createElement(
                        "button"
                    );


                boton.textContent =
                    textoNota(nota);


                boton.addEventListener(
                    "click",
                    () => {

                        reproducirFrecuencia(
                            frecuenciaNota(
                                nota.semitonos
                            )
                        );


                        secuencia.push({

                            ...nota,

                            indice: indice

                        });


                        actualizarMelodia();

                    }
                );


                contenedor.appendChild(
                    boton
                );

            }
        );

    }


    // ==========================================
    // ACTUALIZAR MELODÍA
    // ==========================================

    function actualizarMelodia() {

        const contenedor =
            document
                .getElementById(
                    "melodia"
                );


        contenedor.innerHTML =
            "";


        if (
            secuencia.length === 0
        ) {

            const vacio =
                document.createElement(
                    "div"
                );


            vacio.className =
                "melodia-vacia";


            vacio.textContent =
                "Hacé clic en las notas para construir la melodía";


            contenedor.appendChild(
                vacio
            );


            return;

        }


        secuencia.forEach(
            (nota) => {

                const boton =
                    document.createElement(
                        "button"
                    );


                boton.className =
                    "nota-melodia";


                boton.textContent =
                    textoNota(nota);


                boton.addEventListener(
                    "click",
                    () => {

                        reproducirFrecuencia(
                            frecuenciaNota(
                                nota.semitonos
                            )
                        );

                    }
                );


                contenedor.appendChild(
                    boton
                );

            }
        );

    }


    // ==========================================
    // ESCUCHAR TÓNICA
    // ==========================================

    document
        .getElementById(
            "escucharTonica"
        )
        .addEventListener(
            "click",
            () => {

                reproducirFrecuencia(
                    frecuenciaNota(0),
                    0.8
                );

            }
        );


    // ==========================================
    // CAMBIO DE MODO
    // ==========================================

    document
        .getElementById(
            "modo"
        )
        .addEventListener(
            "change",
            (event) => {

                modoActual =
                    event.target.value;


                secuencia =
                    [];


                crearBotones();

                actualizarMelodia();

            }
        );


    // ==========================================
    // CAMBIO DE TÓNICA
    // ==========================================

    document
        .getElementById(
            "tonica"
        )
        .addEventListener(
            "change",
            () => {

                secuencia =
                    [];


                actualizarMelodia();

            }
        );


    // ==========================================
    // CAMBIO SOLFEO / GRADOS
    // ==========================================

    document
        .querySelectorAll(
            'input[name="formaMostrar"]'
        )
        .forEach(
            (radio) => {

                radio.addEventListener(
                    "change",
                    (event) => {

                        formaMostrar =
                            event.target.value;


                        crearBotones();

                        actualizarMelodia();

                    }
                );

            }
        );


    // ==========================================
    // VOLUMEN
    // ==========================================

    const controlVolumen =
        document.getElementById(
            "volumen"
        );


    const valorVolumen =
        document.getElementById(
            "valorVolumen"
        );


    controlVolumen
        .addEventListener(
            "input",
            () => {

                valorVolumen.textContent =
                    controlVolumen.value +
                    "%";

            }
        );


    // ==========================================
    // CAMBIO DE TIMBRE
    // ==========================================

    document
        .getElementById(
            "timbre"
        )
        .addEventListener(
            "change",
            () => {

                reproducirFrecuencia(
                    frecuenciaNota(0),
                    0.6
                );

            }
        );


    // ==========================================
    // ÚLTIMA NOTA
    // ==========================================

    document
        .getElementById(
            "ultima"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    secuencia.length > 0
                ) {

                    secuencia.pop();

                    actualizarMelodia();

                }

            }
        );


    // ==========================================
    // BORRAR TODO
    // ==========================================

    document
        .getElementById(
            "borrar"
        )
        .addEventListener(
            "click",
            () => {

                secuencia =
                    [];


                actualizarMelodia();

            }
        );


    // ==========================================
    // REPRODUCIR MELODÍA
    // ==========================================

    document
        .getElementById(
            "reproducir"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    secuencia.length === 0
                ) {

                    return;

                }


                const duracion =
                    0.5;


                secuencia.forEach(
                    (nota, indice) => {

                        setTimeout(
                            () => {

                                reproducirFrecuencia(

                                    frecuenciaNota(
                                        nota.semitonos
                                    ),

                                    0.45

                                );

                            },

                            indice *
                            duracion *
                            1000
                        );

                    }
                );

            }
        );


    // ==========================================
    // INICIO
    // ==========================================

    crearBotones();

    actualizarMelodia();

</script>

</body>
</html>
